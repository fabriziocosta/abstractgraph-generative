[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractgraph-generative"
version = "0.1.0"
description = "Edge-based, conditional autoregressive, and combined AbstractGraph generation, with supporting graph utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "abstractgraph>=0.1.0",
  "abstractgraph-ml>=0.1.0",
  "networkx>=3.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "joblib>=1.2",
  "toolz>=0.12",
  "dill>=0.3.7",
]

[project.optional-dependencies]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
